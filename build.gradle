plugins {
    id 'java'
    id 'jacoco'
    id "org.sonarqube" version "4.4.1.3373"
    id 'maven-publish'
}

group = 'com.example'
version = '1.0-Jenkins'

repositories {
    mavenCentral()
}

/* =========================
   Java Configuration
   ========================= */
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17) // ✅ Use Java 17
    }
}

/* =========================
   Dependencies
   ========================= */
dependencies {
    testImplementation 'io.cucumber:cucumber-java:7.14.0'
    testImplementation 'io.cucumber:cucumber-junit:7.14.0'
    testImplementation 'junit:junit:4.13.2'
}

/* =========================
   JaCoCo
   ========================= */
jacoco {
    toolVersion = '0.8.10'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required.set(true)
        csv.required.set(false)
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.dir("reports/jacoco"))
    }
}

/* =========================
   SonarQube
   ========================= */
sonarqube {
    properties {
        property "sonar.projectKey", "tp"
        property "sonar.projectName", "Jenkins Pipeline"
        property "sonar.host.url", "http://localhost:9000"
        property "sonar.token", project.findProperty("SONAR_TOKEN") ?: ""
        property "sonar.sources", "src/main/java"
        property "sonar.tests", "src/test/java"
        property "sonar.java.binaries", "build/classes/java/main"
        property "sonar.coverage.jacoco.xmlReportPaths",
                 "build/reports/jacoco/test/jacocoTestReport.xml"
    }
}

// ✅ Ensure sonar task runs after tests and coverage
tasks.named('sonar') {
    dependsOn test, jacocoTestReport
}

/* =========================
   Maven Publishing
   ========================= */
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.example'
            artifactId = 'my-library'
            version = '1.0.0'
        }
    }
    repositories {
        maven {
            name = "myrepo"
            url = uri("https://mymavenrepo.com/repo/cEmjfkxugPlzLxXg1A2B/")
            credentials {
                username = "myMavenRepo"
                password = "test0005"
            }
        }
    }
}

/* =========================
   Javadoc
   ========================= */
tasks.withType(Javadoc).configureEach {
    source = sourceSets.main.allJava
    classpath = sourceSets.main.compileClasspath
    destinationDirectory.set(layout.buildDirectory.dir("docs/javadoc"))
    options.encoding = 'UTF-8'
}

/* =========================
   Tests
   ========================= */
test {
    useJUnit()
    finalizedBy jacocoTestReport
}

